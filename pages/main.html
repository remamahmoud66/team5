<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        EVOLVIA - Learning Management Dashboard
    </title>


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    />


    <!-- =====================================================
         GLOBAL CSS
    ====================================================== -->

   


    <!-- =====================================================
         PAGE CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    />

    <link
        rel="stylesheet"
        href="./css/attendance.css"
    />

    <link
        rel="stylesheet"
        href="../css/profile.css"
    />

    <link
        rel="stylesheet"
        href="../css/students.css"
    />

    <link
        rel="stylesheet"
        href="../css/subject.css"
    />

    <link
        rel="stylesheet"
        href="../css/classes.css"
    />

    <link
        rel="stylesheet"
        href="../css/homework.css"
    />

    <link
        rel="stylesheet"
        href="../css/exams.css"
    />

     <link
        rel="stylesheet"
        href="../css/App.css"
    />

</head>


<body>


    <!-- =====================================================
         MOBILE MENU BUTTON
    ====================================================== -->

    <button
        id="mobile-menu-btn"
        class="mobile-menu-btn"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
    >
        ☰
    </button>


    <!-- =====================================================
         SIDEBAR OVERLAY
    ====================================================== -->

    <div
        id="sidebar-overlay"
        class="sidebar-overlay"
    ></div>


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">


        <div>


            <!-- =================================================
                 BRAND
            ================================================== -->

            <div class="brand-header">

                <div class="brand-icon">

                    <img
                        src="../assets/imgs/logo.png"
                        alt="EVOLVIA Logo"
                    />

                </div>


                <div class="brand-text">

                    EVOLVIA

                    <span class="brand-sub">
                        Academy System
                    </span>

                </div>

            </div>


            <!-- =================================================
                 NAVIGATION
            ================================================== -->

            <nav class="nav-menu">


                <div class="nav-section-title">
                    Main Navigation
                </div>


                <!-- Dashboard -->

                <a
                    href="#dashboard"
                    class="nav-link active"
                    data-page="dashboard"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"
                        />

                    </svg>

                    <span>
                        Dashboard
                    </span>

                </a>


                <!-- Students -->

                <a
                    href="#students"
                    class="nav-link"
                    data-page="students"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"
                        />

                    </svg>

                    <span>
                        Students
                    </span>

                </a>


                <!-- Subjects -->

                <a
                    href="#subjects"
                    class="nav-link"
                    data-page="subjects"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M4 4h16v2H4V4zm0 4h16v2H4V8zm0 4h10v2H4v-2zm0 4h10v2H4v-2z"
                        />

                    </svg>

                    <span>
                        Subjects
                    </span>

                </a>


                <!-- Classes -->

                <a
                    href="#classes"
                    class="nav-link"
                    data-page="classes"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4l7 3.82 7-3.82v-4L12 17l-7-3.82z"
                        />

                    </svg>

                    <span>
                        Classes
                    </span>

                </a>


                <!-- Homework -->

                <a
                    href="#homework"
                    class="nav-link"
                    data-page="homework"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"
                        />

                    </svg>

                    <span>
                        Homework
                    </span>

                </a>


                <!-- Exams -->

                <a
                    href="#exams"
                    class="nav-link"
                    data-page="exams"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm3-4H7v-2h8v2zm0-4H7V7h8v2z"
                        />

                    </svg>

                    <span>
                        Exams
                    </span>

                </a>


                <!-- Attendance -->

                <a
                    href="#attendance"
                    class="nav-link"
                    data-page="attendance"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.11.89 2 2 2h14c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"
                        />

                    </svg>

                    <span>
                        Attendance
                    </span>

                </a>


            </nav>

        </div>


        <!-- =====================================================
             LOGOUT
        ====================================================== -->

        <div class="sidebar-logout">

            <a
                href="#logout"
                class="logout-btn"
            >

                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                >

                    <path
                        d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"
                    />

                </svg>

                <span>
                    Log Out
                </span>

            </a>

        </div>


    </aside>


    <!-- =====================================================
         CONTENT WRAPPER
    ====================================================== -->

    <div class="content-wrapper">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="header">


            <nav class="breadcrumb">

                <span class="breadcrumb-current">
                    Classes & Schedule
                </span>

            </nav>


            <div class="header-actions">


                <!-- Notification -->

                <button
                    type="button"
                    class="notification-btn"
                    aria-label="Notifications"
                >

                    <svg
                        width="22"
                        height="22"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                    >

                        <path
                            d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-5v-1l-2-2v-4a5 5 0 0 0-4-4.9V4a1 1 0 1 0-2 0v1.1A5 5 0 0 0 7 10v4l-2 2v1h14z"
                        />

                    </svg>

                    <span class="notification-dot"></span>

                </button>


                <!-- User Profile -->

                <button
                    type="button"
                    class="user-profile"
                    data-page="profile"
                >

                    <div
                        class="avatar"
                        id="avatar"
                    ></div>


                    <div class="user-info">

                        <span
                            class="user-name"
                            id="profileName"
                        ></span>

                        <span class="user-role">
                            Teacher
                        </span>

                    </div>

                </button>


            </div>


        </header>


        <!-- =================================================
             MAIN APP
        ================================================== -->

        <main id="app">

            <div id="content"></div>

        </main>


        <!-- =================================================
             FOOTER
        ================================================== -->

        <footer class="footer">

            <div>
                © 2026 EVOLVIA Academy Learning System
            </div>

            <div>
                Privacy Policy • Terms of Service
            </div>

        </footer>


    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="../js/app.js"
    ></script>


</body>

</html>
