
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/App.css">
    <link rel="stylesheet" href="../css/register.css">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css"> -->

    <title>Registration</title>
</head>

<body>

    <main>

        <figure>
            <a href="./welcome.html">
                <img src="../assets/imgs/register-img.png" alt="register-img">
            </a>
        </figure>

        <section class="register-section">

            <h1>Create Your Account</h1>

            <div class="login-register-container">
                <a href="./register.html" class="register-btn">Register</a>
                <a href="./login.html" class="login-btn">Login</a>
            </div>

            <form action="" method="post" class="register-form">

                <div class="input-group full-width">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" required>
                    <div class="message fullName-message"></div>
                </div>

                <div class="input-group">
                    <label for="birthDate">Birth Date</label>
                    <input
                        type="date"
                        id="birthDate"
                        min="1956-01-01"
                        max="2005-10-01"
                        required
                    >
                    <div class="message birthDate-message"></div>
                </div>

                <div class="input-group">
                    <label for="degree">Degree</label>
                    <input
                        type="text"
                        id="degree"
                        placeholder="e.g. Bachelor of Computer Science"
                        required
                    >
                    <div class="message degree-message"></div>
                </div>

                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="07XXXXXXXX"
                        required
                    >
                    <div class="message phone-message"></div>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="name@example.com"
                        required
                    >
                    <div class="message email-message"></div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        required
                    >
                    <div class="message password-message"></div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        required
                    >
                    <div class="message confirmPassword-message"></div>
                </div>

                <button type="submit">Create Account</button>

            </form>

            <p>
                Already have an account?
                <a href="./login.html">Login</a>
            </p>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script type="module" src="../js/register.js"></script>

</body>

</html>
