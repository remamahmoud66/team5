    <style>
      .notifications-page {
        padding: 32px;
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
      }
      .notifications-card {
        background: var(--color-white);
        border: 1px solid var(--color-border);
        border-radius: 18px;
        overflow: hidden;
      }
      .notifications-toolbar {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 20px;
        border-bottom: 1px solid var(--color-border);
      }
      .notifications-list-full {
        display: flex;
        flex-direction: column;
      }
      .notification-row {
        display: flex;
        gap: 14px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--color-border);
        text-decoration: none;
        color: inherit;
      }
      .notification-row.unread {
        background: rgba(232, 163, 61, 0.08);
      }
      .notification-row:hover {
        background: var(--color-bg);
      }
      .notification-row:last-child {
        border-bottom: 0;
      }
      .notification-row .notif-icon-box {
        margin-top: 2px;
      }
      .notification-copy {
        flex: 1;
        min-width: 0;
      }
      .notification-copy strong {
        display: block;
        margin-bottom: 3px;
      }
      .notification-copy p {
        margin: 0 0 4px;
      }
      .notification-meta {
        font-size: 11px;
        color: var(--color-muted);
      }
      .notifications-empty {
        padding: 48px 20px;
        text-align: center;
        color: var(--color-muted);
      }
      @media (max-width: 640px) {
        .notifications-page {
          padding: 18px 12px;
        }
        .notifications-toolbar {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>

      <main class="notifications-page">
        <div class="notifications-card">
          <div class="notifications-toolbar">
            <div>
              <h1>Notifications</h1>
              <p>Review updates, reminders and activity from your workspace.</p>
            </div>
            <button
              class="btn btn-secondary"
              id="markAllNotifications"
              type="button"
            >
              Mark all as read
            </button>

          <div class="notifications-list-full" id="notificationsList"></div>
        </div>

    <script src="../js/site.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var user = window.EvolviaApp.getUser(),
          list = window.EvolviaApp.read("notifications")
            .filter(function (n) {
              return n.teacherId === user.id;
            })
            .sort(function (a, b) {
              return (
                String(b.date).localeCompare(String(a.date)) ||
                String(b.id).localeCompare(String(a.id))
              );
            });
        var students = window.EvolviaApp.read("students"),
          box = document.getElementById("notificationsList");
        function render() {
          list = window.EvolviaApp.read("notifications")
            .filter(function (n) {
              return n.teacherId === user.id;
            })
            .sort(function (a, b) {
              return (
                String(b.date).localeCompare(String(a.date)) ||
                String(b.id).localeCompare(String(a.id))
              );
            });
          if (!list.length) {
            box.innerHTML =
              '<div class="notifications-empty">No notifications yet.</div>';
            return;
          }
          box.innerHTML = list
            .map(function (n) {
              var s = students.find(function (x) {
                return x.id === n.studentId;
              });
              var target = n.studentId
                ? "./student-details.html?id=" +
                  encodeURIComponent(n.studentId) +
                  "#notifications"
                : "./notifications.html";
              return (
                '<a class="notification-row ' +
                (n.isRead ? "" : "unread") +
                '" href="' +
                target +
                '" data-id="' +
                n.id +
                '"><span class="notif-icon-box">🔔</span><span class="notification-copy"><strong>' +
                (s ? s.fullName : n.type) +
                "</strong><p>" +
                n.text +
                '</p><span class="notification-meta">' +
                n.type +
                " · " +
                n.date +
                (n.isRead ? "" : " · Unread") +
                "</span></span></a>"
              );
            })
            .join("");
        }
        box.addEventListener("click", function (e) {
          var row = e.target.closest("[data-id]");
          if (!row) return;
          var all = window.EvolviaApp.read("notifications");
          var n = all.find(function (x) {
            return x.id === row.dataset.id;
          });
          if (n) {
            n.isRead = true;
            window.EvolviaApp.write("notifications", all);
          }
        });
        document
          .getElementById("markAllNotifications")
          .addEventListener("click", function () {
            var all = window.EvolviaApp.read("notifications");
            all.forEach(function (n) {
              if (n.teacherId === user.id) n.isRead = true;
            });
            window.EvolviaApp.write("notifications", all);
            render();
            window.EvolviaApp.renderNotifications(user);
          });
        render();
      });
    </script>
