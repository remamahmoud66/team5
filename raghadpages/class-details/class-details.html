<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVOLVA - Class Details</title>
    <link rel="stylesheet" href="/global.css">
</head>
<body>

    <aside class="sidebar">
        <div>
            <div class="logo">
                <div class="logo-icon">E</div>
                <span>EVOLVIA</span>
            </div>
            <nav class="nav">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="students.html" class="nav-link">Students</a>
                <a href="classes.html" class="nav-link active">Classes</a>
                <a href="subjects.html" class="nav-link">Subjects</a>
                <a href="attendance.html" class="nav-link">Attendance</a>
            </nav>
        </div>
        <div>
            <button onclick="localStorage.clear(); window.location.href='index.html';" class="btn btn-secondary" style="width: 100%;">Logout</button>
        </div>
    </aside>

    <main class="main-content">
        <header class="page-header" style="align-items: flex-start; margin-bottom: 24px;">
            <div>
                <small style="color: var(--color-muted);">Teacher Portal / Classes</small>
                <h1 id="classNameTitle" style="margin-top: 4px; margin-bottom: 4px;">Loading...</h1>
                <p id="classSubTitle">Loading class details...</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <a href="../classes/classes.html" class="btn btn-secondary" style="min-height: 40px;">&larr; Back</a>
                <button class="btn btn-primary" style="min-height: 40px;">+ Homework</button>
            </div>
        </header>

        <div style="display: flex; gap: 8px; margin-bottom: 24px; background: var(--color-surface); padding: 8px; border-radius: var(--radius-lg); border: 1px solid var(--color-border); width: fit-content;">
            <button class="btn btn-primary" style="min-height: 36px; padding: 0 16px; font-size: 13px;">Overview</button>
            <button class="btn btn-secondary" style="min-height: 36px; padding: 0 16px; font-size: 13px; border:none; background:transparent;">Students</button>
            <button class="btn btn-secondary" style="min-height: 36px; padding: 0 16px; font-size: 13px; border:none; background:transparent;">Materials</button>
            <button class="btn btn-secondary" style="min-height: 36px; padding: 0 16px; font-size: 13px; border:none; background:transparent;">Homework</button>
            <button class="btn btn-secondary" style="min-height: 36px; padding: 0 16px; font-size: 13px; border:none; background:transparent;">Exams</button>
            <button class="btn btn-secondary" style="min-height: 36px; padding: 0 16px; font-size: 13px; border:none; background:transparent;">Attendance</button>
        </div>

        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;">
            <div class="card" style="padding: 16px;">
                <p style="margin-bottom: 4px;">Students</p>
                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <span id="statEnrolledCount" style="font-size: 28px; font-weight: bold; color: var(--color-text);">0</span>
                    <span style="font-size: 12px; color: var(--color-muted);">enrolled</span>
                </div>
            </div>
            <div class="card" style="padding: 16px;">
                <p style="margin-bottom: 4px;">Materials</p>
                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <span style="font-size: 28px; font-weight: bold; color: var(--color-text);">2</span>
                    <span style="font-size: 12px; color: var(--color-muted);">resources</span>
                </div>
            </div>
            <div class="card" style="padding: 16px;">
                <p style="margin-bottom: 4px;">Homework</p>
                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <span style="font-size: 28px; font-weight: bold; color: var(--color-text);">1</span>
                    <span style="font-size: 12px; color: var(--color-muted);">assigned</span>
                </div>
            </div>
            <div class="card" style="padding: 16px;">
                <p style="margin-bottom: 4px;">Exams</p>
                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <span style="font-size: 28px; font-weight: bold; color: var(--color-text);">1</span>
                    <span style="font-size: 12px; color: var(--color-muted);">scheduled</span>
                </div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px;">
            <div class="card">
                <h3 style="margin-bottom: 16px;">Students</h3>
                <div id="classStudentsList" style="display: flex; flex-direction: column; gap: 12px;">
                </div>
            </div>

            <div class="card">
                <h3 style="margin-bottom: 16px;">Recent attendance</h3>
                <div id="attendanceList" style="display: flex; flex-direction: column; gap: 12px;">
                </div>
            </div>
        </div>
    </main>

    <script src="class-details.js"></script>
</body>
</html>
